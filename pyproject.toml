[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "deadcode-finder"
version = "0.1.0"
description = "Find and safely remove dead Python code: unused imports, functions, classes, variables and unreachable code."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Hafsa Anwar" }]
keywords = ["dead code", "unused imports", "static analysis", "linter", "refactoring", "cleanup", "ast"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["tomli>=1.1; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4"]

[project.scripts]
deadcode-finder = "deadcode_finder.cli:main"
dcf = "deadcode_finder.cli:main"

[project.urls]
Homepage = "https://github.com/Hafsa-Anwar65/deadcode-finder"
Issues = "https://github.com/Hafsa-Anwar65/deadcode-finder/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/deadcode_finder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# deadcode-finder scanning itself
[tool.deadcode-finder]
paths = ["src"]
min-confidence = 60
